// draw a 3D object centred at (cx,cy) px with the given size (px), clipped to a tile

/* ---------------- tile chrome ---------------- */

/* ---------------- scroll (f128–150) with per-element lag ---------------- */
const SCROLL = 128, SDUR = 22;

const tileIn = (t, start) => ({ dy: (1 - spring(t - start, 0.3, 0.78)) * 260, a: clamp((t - start) / 7) });

function drawOdometer(g, t, x, base, size, alpha) {

/* ---------------- scene 3: the amount (big tile ↔ grid tile) ---------------- */
function drawAmount(g, t, Rbig, Rsmall, e) {
  // e: 0 = full amount view, 1 = grid tile
  const tile = lerpR(Rbig, Rsmall, e), k = lerp(1, Rsmall.w / GW, e);
  tileBase(g, tile, C.tAmount, k);
  g.save(); rr(g, tile.x, tile.y, tile.w, tile.h, 44 * k); g.clip();
  tileHeader(g, tile, k, COPY.amountTitle, prog(t, 150, 10), { glyph: "₼", icon: "#F2A93B" });
  const sk = Rsmall.w / GW;
  const D = lerpR({ x: Rbig.x, y: Rbig.y + 110, w: Rbig.w, h: 470 }, { x: Rsmall.x, y: Rsmall.y + 76 * sk, w: Rsmall.w, h: 190 * sk }, e);
  const cap = lerp(230, 70 * sk, e);

    rise(g, COPY.amountLabel[1], tile.x + tile.w / 2, cy + 200 * k, 92 * k, C.ink, smooth(prog(t, 170, 14)), { weight: 800, align: "center" });

}
function drawDigits(g, t, D, cap) {

  const u = VH / D.h, k = Math.min(cap / 0.73 * u, 0.84 * VH * (D.w / D.h) / (width + coinR * 1.5));
  grp.scale.setScalar(k); grp.position.set(0, -0.36 * k, 0);
  const id = idle(t, 0.8, 0.6);
  grp.rotation.set(0.1 + id.rx * 0.5, id.ry * 0.45, 0);
  items.forEach((h, i) => {
    const tt = t - (140 + i * 3);
    h.visible = tt > 0;
    const sp = spring(tt, 0.34, 0.5), sr = spring(tt, 0.28, 0.62);
    h.position.set(h.userData.x + shiftX, (1 - sp) * 2.6, 0);
    h.rotation.set(-(1 - sr) * 1.8, (1 - sr) * 0.6, 0);

    const sp = spring(t - 156, 0.2, 0.82), xf = width / 2 + shiftX + coinR * 0.66, x = lerp(xf + 5.5, xf, sp);

/* ---------------- scene 4: grid (f192–244) ---------------- */
const PULL = 192;
function gridRects(t) {
  const c2 = { x: SLOT.amount.x + GW / 2, y: SLOT.amount.y + GH / 2 }, cb = { x: BIG.x + BIG.w / 2, y: BIG.y + BIG.h / 2 }, k0 = BIG.w / GW;
  const startOf = R => ({ x: cb.x + (R.x - c2.x) * k0, y: cb.y + (R.y - c2.y) * k0, w: R.w * k0, h: R.h * k0 });
  const lags = { amount: 0, rate: 3, portrait: 2, com: 4, term: 5, online: 7 }, r = {};
  for (const id in SLOT) { const s = spring(t - PULL - lags[id], 0.24, 0.8); r[id] = { R: lerpR(startOf(SLOT[id]), SLOT[id], s), s }; }

}
function pushOut(R, t, center) {
  const p = accel(prog(t, 244, 14)); if (p <= 0) return R;
  const dx = R.x + R.w / 2 - center.x, dy = R.y + R.h / 2 - center.y, d = Math.hypot(dx, dy) || 1;
  return { ...R, x: R.x + dx / d * 1700 * p, y: R.y + dy / d * 1700 * p };
}
const GRID_OBJ = {
  rate:   { o: () => O.pct,    size: 230, pos: [372, 248], rot: [0.25, -0.5, 0.18], color: () => C.tRate },
  com:    { o: () => O.shield, size: 200, pos: [374, 250], rot: [0, -0.35, -0.12],  color: () => C.tCom },
  term:   { o: () => O.cal,    size: 190, pos: [374, 254], rot: [0.15, -0.45, 0.1], color: () => C.tTerm },
  online: { o: () => O.phone,  size: 260, pos: [384, 244], rot: [0.2, -0.55, 0.22], color: () => C.navy },
};
function drawGridTile(g, t, id, R, ph) {
  const k = R.w / GW, idl = idle(t, ph, 0.8), dark = id === "online";
  if (id === "portrait") {
    g.save(); softShadow(g, k); g.fillStyle = "#fff"; rr(g, R.x, R.y, R.w, R.h, 44 * k); g.fill(); g.restore();
    drawFootage(g, "portrait", R, 44 * k, 1.0, [0.5, 0.38]);
  } else {
    const spec = GRID_OBJ[id], L = COPY.grid[id];
    tileBase(g, R, spec.color(), k);
    g.save(); rr(g, R.x, R.y, R.w, R.h, 44 * k); g.clip();
    obj3D(g, spec.o(), R.x + spec.pos[0] * k, R.y + spec.pos[1] * k + idl.bob * k, spec.size * k, [spec.rot[0] + idl.rx, spec.rot[1] + idl.ry, spec.rot[2]], { clipR: R, radius: 44 * k });
    font(g, 34 * k, 800, -0.02); g.fillStyle = dark ? "#fff" : C.ink; g.textAlign = "left"; g.fillText(L[0], R.x + 36 * k, R.y + 76 * k);
    font(g, 28 * k, 600, 0); g.fillStyle = dark ? "rgba(255,255,255,0.75)" : C.inkSoft; g.fillText(L[1], R.x + 36 * k, R.y + 116 * k);
    g.restore();
  }

}
function drawScene4(g, t) {
  const G = gridRects(t), c5 = { x: SLOT.online.x + GW / 2, y: SLOT.online.y + GH / 2 };
  const ph = { portrait: 0, rate: 0.7, com: 1.9, term: 3.3, online: 4.4 };
  for (const id of ["portrait", "rate", "com", "term"]) drawGridTile(g, t, id, pushOut(G[id].R, t, c5), ph[id]);

      g.save(); g.globalAlpha = 1 - smooth(prog(t, 244, 6)); drawGridTile(g, t, "online", R0, ph.online); g.restore();

/* ---------------- scene 5: end card ---------------- */
function drawScene5(g, t) {

    const rp = spring(t - 256, 0.3, 0.8); if (rp > 0) { g.fillStyle = C.azure; rr(g, -200 * rp, 130, 400 * rp, 18, 9); g.fill(); }

  rise(g, COPY.tagline[1], 540, 1100, 76, "#fff", smooth(prog(t, 263, 14)), { weight: 600, align: "center" });
  const cs = spring(t - 268, 0.32, 0.6);

    g.save(); g.translate(540, 1250); g.scale(lerp(0.7, 1, cs), lerp(0.7, 1, cs)); g.globalAlpha = clamp(cs * 2);
    g.fillStyle = "#fff"; rr(g, -pw / 2, -54, pw, 108, 54); g.fill(); g.fillStyle = C.navy; g.textAlign = "center"; g.fillText(COPY.cta, 0, 19); g.restore();

    lines.push(line); lines.forEach((l, i) => g.fillText(l, 540, 1400 + i * 36)); g.restore();

/* ---------------- one instant ---------------- */
function drawAt(g, t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.filter = "none";
  g.fillStyle = C.canvas; g.fillRect(0, 0, W, H);
  if (t < 156) drawScene12(g, t);
  if (t >= SCROLL && t < PULL) { const R = { ...BIG, y: BIG.y + scrollY(t, 3) + H }; drawAmount(g, t, R, R, 0); }
  if (t >= PULL && t < 262) drawScene4(g, t);
  if (t >= 244) {
    g.save();
    if (t < 262) { const R = lerpR(gridRects(t).online.R, { x: 0, y: 0, w: W, h: H }, spring(t - 244, 0.22, 0.9)); rr(g, R.x, R.y, R.w, R.h, lerp(44, 0, clamp(spring(t - 244, 0.22, 0.9)))); g.clip(); }
    drawScene5(g, t); g.restore();
  }
}

/* ---------------- frame (sub-frame accumulation = real motion blur) ---------------- */
let showSafe = false;
function renderFrame(f, sub = 1) {
  f = Math.max(0, Math.min(FRAMES - 1, f));
  out.setTransform(1, 0, 0, 1, 0, 0); out.globalAlpha = 1;
  if (sub <= 1) { drawAt(ctx, f); out.drawImage(buf, 0, 0); }
  else {
    // more samples on the fast moves (scroll, pull-back, end-card expand) so the blur is smooth, not strobed
    const fast = (f >= 126 && f <= 158) || (f >= 190 && f <= 214) || (f >= 242 && f <= 262) || (f >= 38 && f <= 58);
    const n = fast ? Math.max(sub, 12) : sub, shutter = 0.4;
    for (let i = 0; i < n; i++) {
      drawAt(ctx, Math.max(0, f + (i / (n - 1) - 0.5) * shutter));
      actx.globalAlpha = 1 / (i + 1); actx.drawImage(buf, 0, 0);
    }
    actx.globalAlpha = 1; out.drawImage(acc, 0, 0);
  }
  if (showSafe) { out.save(); out.strokeStyle = "rgba(255,0,80,0.8)"; out.lineWidth = 3; out.setLineDash([16, 10]); out.strokeRect(64, 250, W - 128, H - 650); out.restore(); }
}

/* ---------------- boot ---------------- */
window.FILM = { W, H, FPS, FRAMES, renderFrame };
window.filmReady = (async () => {
  await Promise.all([
    document.fonts.load('800 100px "Inter Tight"', "KOMİSSİYASIZ əİığşçöü 0123456789% ₼"),
    document.fonts.load('600 100px "Inter Tight"', "Hər kəs üçün əİığşçöü"),
  ]);
  const buf3 = await (await fetch("fonts/inter-tight-latin-800-normal.woff")).arrayBuffer();
  FONT3D = new Font(new TTFLoader().parse(buf3));
  build3D();
  for (const k of ["work", "portrait"]) FOOTAGE[k] = (await loadImg(FOOTAGE_SRC[k])) || paintPlaceholder(k);
  return true;
})();

const qs = new URLSearchParams(location.search);
if (qs.has("render")) document.body.classList.add("render");
else window.filmReady.then(() => {
  const scrub = document.getElementById("scrub"), tc = document.getElementById("tc"), btn = document.getElementById("play");
  let f = +(qs.get("f") || 0), playing = !qs.has("f"), last = 0;
  const show = () => { renderFrame(f, 1); scrub.value = f; tc.textContent = `f${String(f).padStart(3, "0")} · ${(f / FPS).toFixed(2)}s`; };
  scrub.oninput = () => { f = +scrub.value; playing = false; btn.textContent = "Play"; show(); };
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? "Pause" : "Play"; };
  document.getElementById("safe").onchange = e => { showSafe = e.target.checked; show(); };
  btn.textContent = playing ? "Pause" : "Play";
  const tick = ts => { if (playing && ts - last >= 1000 / FPS) { last = ts; f = (f + 1) % FRAMES; show(); } requestAnimationFrame(tick); };
  show(); requestAnimationFrame(tick);
});
</script>
