<script type="module">
/* ============================================================
   VTB Bank — Cash loan · 17.1 s vertical (1080×1920, 30 fps): 15.0 s film + 2.1 s VTB logo sting, timed to the voiceover
   Style: soft app tiles (Yandex / WB-bank screens) with glossy 3D objects
   cropped at the tile corner. Motion: springs + continuous idle float,
   real motion blur (sub-frame accumulation) in the master render.
   Every frame is a pure function of time t (in frames, fractional OK).
   ============================================================ */
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { TextGeometry } from "three/addons/geometries/TextGeometry.js";
import { TTFLoader } from "three/addons/loaders/TTFLoader.js";
import { Font } from "three/addons/loaders/FontLoader.js";

const W = 1080, H = 1920, FPS = 30, FRAMES = 450;   // 15.0 s of film; render.mjs appends the VTB logo sting (2.1 s)

/* Story time vs real time: the animation is written in "story" frames; HOLDS insert still moments
   (objects keep floating) after each condition so it can be read. [story frame, extra real frames] */
const HOLDS = [[130, 50], [184, 41], [288, 44]];
function toStory(t) { let s = t; for (const [hs, ex] of HOLDS) { if (s <= hs) break; if (s <= hs + ex) return hs; s -= ex; } return s; }

// ---- Palette: client gradient #0250BF → #67C6FF; sting navy #04378F (from the VTB logo animation)
const C = {
  navy: "#0250BF", azure: "#2E8EEA", sky: "#67C6FF", sting: "#04378F", gold: "#F2B544",
  ink: "#0B1F4D", inkSoft: "#5A6E92",
  gradTop: "#0250BF", gradBottom: "#67C6FF", white: "#FFFFFF",
  tRate: "#FFFFFF", tCom: "#F1F5FF", tTerm: "#EEF7FF", tAmount: "#FFFFFF",
};
function bgGradient(g) { const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, C.gradTop); gr.addColorStop(1, C.gradBottom); return gr; }

// ---- Copy — follows the voiceover (audio/voiceover.wav). Only 9,9% and 100 000 are shown as conditions.
// VO: "Bank VTB-dən səhiyyə işçiləri üçün 9,9%-dən başlayan zaminsiz kredit. / 100 min manata dək məbləği
//      VTB.az saytından onlayn və ya ən yaxın filialda sürətli rəsmiləşdir. / Daha ətraflı məlumat üçün
//      986 qısa nömrəsi ilə əlaqə saxla."   (on screen the profession is oil & mining workers, per client)
const COPY = {
  audience: "Neft və mədənçıxarma işçilərinə",
  rateTitle: "İllik faiz", rate: "9.9", rateSuffix: "%-dən",
  lockup: ["Zaminsiz", "kredit"],
  amountTitle: "Kredit məbləği", amount: "100 000", amountLabel: ["AZN-dək", "nağd kredit"],
  headline: ["Onlayn və ya filialda", "sürətli rəsmiləşdir"],
  grid: {
    rate:   ["9.9%-dən", "illik faiz"],
    online: ["Onlayn", "vtb.az saytından"],
    branch: ["Filialda", "ən yaxın ünvanda"],
    fast:   ["Sürətli", "rəsmiləşdirmə"],
  },
};
const FOOTAGE_FRAMES = 150;   // footage/worker.mp4 → footage/frames/0001.jpg… (render.mjs extracts them)

/* ---------------- timing helpers ---------------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, s, d) => clamp((t - s) / d);
const smooth = x => x * x * x * (x * (x * 6 - 15) + 10);                 // smootherstep
const inOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const accel = x => x * x * x;
// damped spring 0→1 (w: stiffness per frame, z: damping ratio; z<1 overshoots softly)
function spring(t, w = 0.36, z = 0.72) {
  if (t <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const lerpR = (a, b, s) => ({ x: lerp(a.x, b.x, s), y: lerp(a.y, b.y, s), w: lerp(a.w, b.w, s), h: lerp(a.h, b.h, s) });
const wave = (t, period, ph = 0) => Math.sin((t / period) * Math.PI * 2 + ph);

/* ---------------- 2D helpers ---------------- */
const out = document.getElementById("c").getContext("2d");
const buf = document.createElement("canvas"); buf.width = W; buf.height = H;
const ctx = buf.getContext("2d");
const acc = document.createElement("canvas"); acc.width = W; acc.height = H;
const actx = acc.getContext("2d");
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; };
// VTB Group everywhere; letters set a touch tighter than default (−1.5% on top of each style's tracking)
const TIGHT = -0.015;
function font(g, size, weight = 700, track = 0) { g.font = `${weight} ${size}px "VTB Group", "Inter Tight"`; g.letterSpacing = `${(size * (track + TIGHT)).toFixed(2)}px`; }
function rr(g, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); g.beginPath(); g.roundRect(x, y, w, h, r); }
function softShadow(g, s = 1, a = 0.16) { g.shadowColor = `rgba(1,30,95,${a})`; g.shadowBlur = 48 * s; g.shadowOffsetY = 18 * s; g.shadowOffsetX = 0; }
// text that rises + fades in (p 0→1)
function rise(g, text, x, y, size, color, p, { weight = 700, track = -0.02, align = "left", alpha = 1 } = {}) {
  if (p <= 0) return;
  g.save(); font(g, size, weight, track); g.textAlign = align; g.textBaseline = "alphabetic";
  g.globalAlpha *= clamp(p * 1.6) * alpha; g.fillStyle = color;
  g.fillText(text, x, y + (1 - p) * size * 0.55);
  g.restore();
}

/* ---------------- footage: worker clip (1280×720), ping-pong looped on real time ---------------- */
const FOOT = [];
const loadImg = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
function footFrame() { const n = FOOT.length, k = Math.floor(RT) % (2 * n - 2); return FOOT[k < n ? k : 2 * n - 2 - k]; }
function drawFootage(g, _kind, R, r, zoom = 1, focal = [0.6, 0.45]) {
  const img = footFrame(), s = Math.max(R.w / img.width, R.h / img.height) * zoom, dw = img.width * s, dh = img.height * s;
  let ox = R.x + R.w / 2 - dw * focal[0], oy = R.y + R.h / 2 - dh * focal[1];
  ox = Math.min(R.x, Math.max(R.x + R.w - dw, ox)); oy = Math.min(R.y, Math.max(R.y + R.h - dh, oy));
  g.save(); rr(g, R.x, R.y, R.w, R.h, r); g.clip(); g.drawImage(img, ox, oy, dw, dh); g.restore();
}

/* ============================================================
   3D — glossy soft-plastic objects (three.js), rendered per object
   into a scissored viewport, then composited into the 2D frame.
   ============================================================ */
const glc = document.getElementById("gl");
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.05;
renderer.autoClear = false;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.85;
const key = new THREE.DirectionalLight(0xffffff, 1.7); key.position.set(-4, 6, 7); scene.add(key);
const rim = new THREE.DirectionalLight(0xcfe9ff, 0.6); rim.position.set(5, -2, 3); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb9cfe6, 0.5));
const cam = new THREE.PerspectiveCamera(24, 1, 0.1, 100); cam.position.set(0, 0, 10);
const VH = 2 * 10 * Math.tan(THREE.MathUtils.degToRad(12));  // world units visible vertically at z=0

const plastic = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.3, metalness: 0, clearcoat: 0.9, clearcoatRoughness: 0.18, ...o });
const M = {
  azure: plastic(C.azure), azureLight: plastic(C.sky), navy: plastic(C.navy, { roughness: 0.35 }),
  white: plastic("#FFFFFF", { roughness: 0.22 }), pearl: plastic("#F4FAFF", { roughness: 0.2 }),
  gold: plastic(C.gold, { metalness: 0.35, roughness: 0.28 }), goldDeep: plastic("#D99A2B", { metalness: 0.4, roughness: 0.3 }),
};
const OBJ = [];
// wrap: outer (animated) > mid (normalised to max dimension 1) > inner (centred)
function wrap(inner) {
  const outer = new THREE.Group(), mid = new THREE.Group();
  mid.add(inner); outer.add(mid);
  const b = new THREE.Box3().setFromObject(inner), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  inner.position.sub(c); mid.scale.setScalar(1 / Math.max(s.x, s.y, s.z));
  outer.visible = false; scene.add(outer); OBJ.push(outer); return outer;
}
let FONT3D = null;
function text3D(str, { size = 1, depth = 0.34, bevel = 0.05, mats = [M.white, M.azure] } = {}) {
  const geo = new TextGeometry(str, { font: FONT3D, size, depth, curveSegments: 10, bevelEnabled: true, bevelThickness: bevel * 1.3, bevelSize: bevel, bevelSegments: 5 });
  geo.computeBoundingBox(); const bb = geo.boundingBox;
  geo.translate(-(bb.max.x + bb.min.x) / 2, 0, -depth / 2);
  const m = new THREE.Mesh(geo, mats); m.userData.adv = bb.max.x - bb.min.x; return m;
}
function extrude(shape, depth, bevel, mat, seg = 6) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: seg, curveSegments: 24 });
  g.translate(0, 0, -depth / 2); return new THREE.Mesh(g, mat);
}

function makeCoin() {
  const g = new THREE.Group();
  const r = 1, th = 0.26, e = 0.09, pts = [new THREE.Vector2(0, th / 2)];
  for (let i = 0; i <= 10; i++) { const a = Math.PI / 2 - (i / 10) * Math.PI; pts.push(new THREE.Vector2(r - e + Math.cos(a) * e, Math.sin(a) * (th / 2))); }
  pts.push(new THREE.Vector2(0, -th / 2));
  const body = new THREE.Mesh(new THREE.LatheGeometry(pts, 64), M.gold); body.rotation.x = Math.PI / 2; g.add(body);
  for (const z of [1, -1]) { const ring = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.035, 12, 64), M.goldDeep); ring.position.z = z * th / 2; g.add(ring); }
  // manat sign ₼
  const arch = new THREE.Shape(), R1 = 0.42, R0 = 0.29, base = -0.36;
  arch.moveTo(-R1, base); arch.lineTo(-R1, 0); arch.absarc(0, 0, R1, Math.PI, 0, true); arch.lineTo(R1, base);
  arch.lineTo(R0, base); arch.lineTo(R0, 0); arch.absarc(0, 0, R0, 0, Math.PI, false); arch.lineTo(-R0, base); arch.closePath();
  const stem = new THREE.Shape(); stem.moveTo(-0.065, base); stem.lineTo(0.065, base); stem.lineTo(0.065, 0.52); stem.lineTo(-0.065, 0.52); stem.closePath();
  for (const z of [1, -1]) for (const s of [arch, stem]) { const m = extrude(s, 0.05, 0.025, M.goldDeep, 3); m.position.set(0, -0.04, z * (th / 2 + 0.01)); if (z < 0) m.rotation.y = Math.PI; g.add(m); }
  return g;
}
function makeShield() {
  const g = new THREE.Group(), s = new THREE.Shape();
  s.moveTo(0, 1.0); s.bezierCurveTo(0.3, 0.86, 0.6, 0.8, 0.86, 0.8); s.lineTo(0.84, 0.05); s.bezierCurveTo(0.8, -0.5, 0.4, -0.86, 0, -1.06);
  s.bezierCurveTo(-0.4, -0.86, -0.8, -0.5, -0.84, 0.05); s.lineTo(-0.86, 0.8); s.bezierCurveTo(-0.6, 0.8, -0.3, 0.86, 0, 1.0);
  g.add(extrude(s, 0.3, 0.14, M.azure));
  const ck = new THREE.Shape(); [[-0.44, 0.04], [-0.14, -0.26], [0.46, 0.34], [0.32, 0.48], [-0.14, 0.02], [-0.3, 0.18]].forEach(([x, y], i) => i ? ck.lineTo(x, y) : ck.moveTo(x, y)); ck.closePath();
  const c = extrude(ck, 0.08, 0.05, M.white, 4); c.position.z = 0.3; g.add(c);
  return g;
}
function makeCalendar() {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new RoundedBoxGeometry(1.7, 1.6, 0.36, 5, 0.16), M.pearl));
  const top = new THREE.Mesh(new RoundedBoxGeometry(1.7, 0.5, 0.4, 5, 0.16), M.azure); top.position.y = 0.58; g.add(top);
  for (const x of [-0.45, 0.45]) { const ring = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.055, 12, 32), M.navy); ring.position.set(x, 0.86, 0.02); ring.rotation.y = Math.PI / 2; g.add(ring); }
  const t = text3D("59", { size: 0.62, depth: 0.12, bevel: 0.025, mats: [M.navy, M.navy] }); t.position.set(0, -0.5, 0.2); g.add(t);
  return g;
}
function makePercent() { return text3D("%", { size: 1, depth: 0.42, bevel: 0.07, mats: [M.azureLight, M.azure] }); }
function makePhone() {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new RoundedBoxGeometry(1.05, 2.05, 0.14, 6, 0.12), M.navy));
  const sc = mk(512, 1000), s = sc.getContext("2d");
  let gr = s.createLinearGradient(0, 0, 0, 1000); gr.addColorStop(0, C.sky); gr.addColorStop(1, C.navy); s.fillStyle = gr; s.fillRect(0, 0, 512, 1000);
  font(s, 120, 800, -0.03); s.fillStyle = "#fff"; s.textAlign = "center"; s.fillText("VTB", 256, 250);
  s.fillStyle = "rgba(255,255,255,0.95)"; rr(s, 50, 330, 412, 250, 40); s.fill();
  font(s, 40, 600); s.fillStyle = "#5B6B85"; s.fillText("Nağd kredit", 256, 410);
  font(s, 76, 800, -0.03); s.fillStyle = C.navy; s.fillText("100 000", 256, 510);
  s.fillStyle = "#fff"; rr(s, 50, 760, 412, 110, 55); s.fill(); font(s, 44, 800); s.fillStyle = C.navy; s.fillText("Müraciət et", 256, 830);
  const tex = new THREE.CanvasTexture(sc); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.92, 1.88), new THREE.MeshPhysicalMaterial({ map: tex, roughness: 0.15, clearcoat: 1, clearcoatRoughness: 0.05 }));
  scr.position.z = 0.072; g.add(scr);
  return g;
}

function makePin() {
  const g = new THREE.Group();
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.55, 48, 32), M.azure); head.position.y = 0.35; g.add(head);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.47, 0.95, 48), M.azure); tip.rotation.z = Math.PI; tip.position.y = -0.38; g.add(tip);
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 24), M.white); dot.position.set(0, 0.38, 0.42); dot.scale.z = 0.5; g.add(dot);
  return g;
}
function makeBolt() {
  const s = new THREE.Shape();
  [[0.18, 1], [-0.55, -0.12], [-0.06, -0.12], [-0.22, -1], [0.56, 0.16], [0.06, 0.16]].forEach(([x, y], i) => i ? s.lineTo(x, y) : s.moveTo(x, y)); s.closePath();
  return extrude(s, 0.3, 0.1, M.gold);
}
const O = { pct: "pct", shield: "shield", coinBig: "coin", phone: "phone", pin: "pin", bolt: "bolt" }; let DIGITS = null;
const SPR = {};   // name → Image (assets/objects/<name>.png)
function build3D() {
  O.shield = wrap(makeShield()); O.cal = wrap(makeCalendar()); O.pct = wrap(makePercent()); O.phone = wrap(makePhone());
  O.coinBig = wrap(makeCoin()); O.pin = wrap(makePin()); O.bolt = wrap(makeBolt());
  O.n986 = wrap(text3D("986", { size: 1, depth: 0.36, bevel: 0.06 }));
  // big amount numerals: one group, digits laid out in font units (cap height ≈ 0.73)
  const grp = new THREE.Group(), items = []; let x = 0;
  for (const ch of COPY.amount) {
    if (ch === " ") { x += 0.24; continue; }
    const m = text3D(ch, { size: 1, depth: 0.36, bevel: 0.05 }), holder = new THREE.Group(); holder.add(m);
    holder.userData.x = x + m.userData.adv / 2; x += m.userData.adv - 0.03; grp.add(holder); items.push(holder);
  }
  const width = x + 0.03; items.forEach(h => { h.userData.x -= width / 2; });
  grp.visible = false; scene.add(grp); OBJ.push(grp);
  DIGITS = { grp, items, width };
}

function renderView(o, rect, extraVisible = null) {
  for (const x of OBJ) x.visible = x === o;
  if (extraVisible) extraVisible.visible = true;
  const x = Math.round(rect.x), y = Math.round(rect.y), w = Math.max(1, Math.round(rect.w)), h = Math.max(1, Math.round(rect.h));
  renderer.setViewport(x, H - y - h, w, h); renderer.setScissor(x, H - y - h, w, h); renderer.setScissorTest(true);
  cam.aspect = w / h; cam.updateProjectionMatrix();

  return { x, y, w, h };
}
function blit(g, rect) {
  const x0 = Math.max(0, rect.x), y0 = Math.max(0, rect.y), x1 = Math.min(W, rect.x + rect.w), y1 = Math.min(H, rect.y + rect.h);
  if (x1 > x0 && y1 > y0) g.drawImage(glc, x0, y0, x1 - x0, y1 - y0, x0, y0, x1 - x0, y1 - y0);

// draw a rendered 3D object (transparent PNG) centred at (cx,cy), its longest side = size px.
// rot = [rx, ry, rz] from the old 3D code: mapped to a gentle 2D tilt + horizontal "turn" squash.
function obj3D(g, o, cx, cy, size, rot = [0, 0, 0], { clipR = null, radius = 44, alpha = 1, shadow = true } = {}) {
  const img = SPR[o]; if (!img || size < 2 || alpha <= 0.01) return;
  const k = size / Math.max(img.width, img.height), w = img.width * k, h = img.height * k;
  const tilt = rot[2] * 0.35 + rot[0] * 0.25 + (rot[1] + 0.4) * 0.12, turn = 1 - 0.06 * Math.abs(Math.sin(rot[1] + 0.4));
  g.save(); g.globalAlpha *= alpha;
  if (clipR) { rr(g, clipR.x, clipR.y, clipR.w, clipR.h, radius); g.clip(); }
  if (shadow) { g.save(); g.filter = `blur(${size * 0.06}px)`; g.fillStyle = "rgba(1,30,95,0.18)"; g.beginPath(); g.ellipse(cx + size * 0.04, cy + h * 0.5, w * 0.36, size * 0.05, 0, 0, 7); g.fill(); g.restore(); }
  g.translate(cx, cy); g.rotate(tilt); g.scale(turn * (1 + 0.015 * wave(RT, 70, cx)), 1 + 0.015 * wave(RT, 70, cx + 1));
  g.drawImage(img, -w / 2, -h / 2, w, h);
  g.restore();
}
// idle float: gentle yaw sway, pitch and bob — keeps every object alive
const idle = (_t, ph, amp = 1) => ({ rx: 0.1 * amp * wave(RT, 140, ph), ry: 0.22 * amp * wave(RT, 110, ph + 1), bob: 7 * amp * wave(RT, 84, ph + 2) });

/* ---------------- tile chrome ---------------- */
function tileBase(g, R, color, s = 1, a = 1) {
  if (color === "GRAD") { const gr = g.createLinearGradient(0, R.y, 0, R.y + R.h); gr.addColorStop(0, C.navy); gr.addColorStop(1, "#3C9BF0"); color = gr; }
  g.save(); g.globalAlpha *= a; softShadow(g, s); g.fillStyle = color; rr(g, R.x, R.y, R.w, R.h, 44 * s); g.fill(); g.restore(); }
function tileHeader(g, R, s, title, p, { dark = false, icon = C.azure, glyph = "" } = {}) {
  if (p <= 0) return;
  g.save(); g.globalAlpha *= clamp(p * 1.5);
  const ix = R.x + 36 * s, iy = R.y + 36 * s + (1 - smooth(p)) * 14 * s, ir = 22 * s;
  g.fillStyle = icon; g.beginPath(); g.arc(ix + ir, iy + ir, ir, 0, 7); g.fill();
  if (glyph) { font(g, (glyph.length > 1 ? 18 : 22) * s, 800, 0); g.fillStyle = "#fff"; g.textAlign = "center"; g.fillText(glyph, ix + ir, iy + ir + 8 * s); }
  font(g, 32 * s, 700, -0.01); g.textAlign = "left"; g.fillStyle = dark ? "#fff" : C.ink; g.fillText(title, ix + ir * 2 + 14 * s, iy + ir + 11 * s);
  g.restore();
}
function checkbox(g, x, y, s, t, at, mode) {
  const S = 40 * s, on = t >= at, k = on ? lerp(0.6, 1, spring(t - at, 0.5, 0.5)) : 1, p = smooth(prog(t, at, 7));
  g.save(); g.translate(x + S / 2, y + S / 2); g.scale(k, k); g.translate(-S / 2, -S / 2);
  rr(g, 0, 0, S, S, 13 * s);
  if (!on) { g.fillStyle = mode === "dark" ? "rgba(255,255,255,0.16)" : "rgba(255,255,255,0.85)"; g.fill(); g.lineWidth = 2.5 * s; g.strokeStyle = mode === "dark" ? "rgba(255,255,255,0.5)" : "#C9D6E6"; g.stroke(); }
  else {
    g.fillStyle = mode === "dark" ? "#fff" : C.azure; g.fill();
    g.strokeStyle = mode === "dark" ? C.navy : "#fff"; g.lineWidth = 4.5 * s; g.lineCap = "round"; g.lineJoin = "round";
    g.setLineDash([34 * s * p, 200]); g.beginPath(); g.moveTo(10 * s, 21 * s); g.lineTo(17 * s, 28 * s); g.lineTo(30 * s, 13 * s); g.stroke();
  }
  g.restore();
}

/* ============================================================
   LAYOUT — every tile/board sits inside the content box: 90 px left/right, 200 px top, 150 px bottom
   (x 90–990, y 200–1770). Only the opening full-bleed footage goes edge to edge.
   ============================================================ */
const M_L = 90, M_R = 90, M_T = 200, M_B = 150;
const BOX = { x: M_L, y: M_T, w: W - M_L - M_R, h: H - M_T - M_B };          // 900 × 1570
const CARD = { x: BOX.x, y: BOX.y, w: BOX.w, h: 836 };                         // 200–1036
const PILL = { x: BOX.x, y: 1068, h: 76 };                                     // 1068–1144
const T_RATE = { x: BOX.x, y: 1176, w: BOX.w, h: 300 };                        // 1176–1476
const T_LOCK = { x: BOX.x, y: 1500, w: BOX.w, h: 270 };                        // 1500–1770
const BIG = { x: BOX.x, y: BOX.y + (BOX.h - 860) / 2, w: BOX.w, h: 860 };      // centred in the box
const HEAD_Y = [BOX.y + 78, BOX.y + 172];                                       // headline baselines
const GRID_TOP = 412, GAP = 24;
const GW = (BOX.w - GAP) / 2, GH = (BOX.y + BOX.h - GRID_TOP - 2 * GAP) / 3;   // 438 × 437; grid ends at 1770
const SLOT = {
  portrait: { x: BOX.x, y: GRID_TOP, w: GW, h: GH },                    rate:   { x: BOX.x + GW + GAP, y: GRID_TOP, w: GW, h: GH },
  amount:   { x: BOX.x, y: GRID_TOP + GH + GAP, w: GW, h: GH },          online: { x: BOX.x + GW + GAP, y: GRID_TOP + GH + GAP, w: GW, h: GH },
  branch:   { x: BOX.x, y: GRID_TOP + 2 * (GH + GAP), w: GW, h: GH },    fast:   { x: BOX.x + GW + GAP, y: GRID_TOP + 2 * (GH + GAP), w: GW, h: GH },
};
// checkbox ticks: the last three land on "onlayn" (7.40 s), "filialda" (8.74 s), "sürətli" (9.12 s)
const TICKS = { portrait: 198, rate: 204, amount: 210, online: 222, branch: 262, fast: 274 };

/* ---------------- scroll to the amount (f132–154, on "100 min") with per-element lag ---------------- */
const SCROLL = 132, SDUR = 22;
const scrollY = (t, lag = 0) => -H * inOut(prog(t, SCROLL + lag, SDUR));
const scrollV = (t, lag = 0) => scrollY(t, lag) - scrollY(t - 1, lag);

/* ---------------- scene 1–2: person → offer (0–4.5 s) ---------------- */
function footageRect(t) {
  const s = spring(t - 20, 0.26, 0.86);
  return { x: lerp(0, CARD.x, s), y: lerp(0, CARD.y, s), w: lerp(W, CARD.w, s), h: lerp(H, CARD.h, s), r: lerp(0, 44, clamp(s)) };
}
const tileIn = (t, start) => ({ dy: (1 - spring(t - start, 0.3, 0.78)) * 260, a: clamp((t - start) / 7) });

function drawScene12(g, t) {
  const zoom = 1.03 + 0.05 * smooth(clamp(t / 40)) + 0.0006 * Math.max(0, t - 40);
  const fr = footageRect(t);
  const R = { x: fr.x, y: fr.y + scrollY(t, 0), w: fr.w, h: fr.h };
  if (t >= 20) { g.save(); softShadow(g); g.fillStyle = "#fff"; rr(g, R.x, R.y, R.w, R.h, fr.r); g.fill(); g.restore(); }
  drawFootage(g, "work", R, fr.r, zoom, [0.6, 0.45]);
  if (t < 24) return;

  { // audience pill — on "işçiləri üçün" (0.9–1.6 s)
    const ps = spring(t - 28, 0.34, 0.6);
    if (ps > 0) {
      font(g, 36, 600, 0); const pw = g.measureText(COPY.audience).width + 76;
      g.save(); g.translate(PILL.x + pw / 2, PILL.y + PILL.h / 2 + scrollY(t, 1)); g.scale(lerp(0.85, 1, ps), lerp(0.85, 1, ps)); g.globalAlpha = clamp(ps * 2);
      g.fillStyle = "#fff"; rr(g, -pw / 2, -PILL.h / 2, pw, PILL.h, PILL.h / 2); g.fill();
      g.fillStyle = C.sky; g.beginPath(); g.arc(-pw / 2 + 32, 0, 8, 0, 7); g.fill();
      g.fillStyle = C.navy; g.textAlign = "left"; g.fillText(COPY.audience, -pw / 2 + 52, 13); g.restore();
    }
  }
  { // rate tile — odometer lands on "9,9%-dən" (1.9–3.0 s); 3D % cropped at the edge
    const a = tileIn(t, 40), v = scrollV(t, 2), Rr = { ...T_RATE, y: T_RATE.y + a.dy + scrollY(t, 2) };
    tileBase(g, Rr, C.tRate, 1, a.a);
    tileHeader(g, Rr, 1, COPY.rateTitle, prog(t, 44, 10), { glyph: "%" });
    const id = idle(t, 0.3), ps = spring(t - 48, 0.3, 0.55);
    obj3D(g, O.pct, Rr.x + Rr.w - 150, Rr.y + 175 + id.bob, 340 * ps, [id.rx + 0.25 + v * 0.004, -0.5 + id.ry - (1 - ps) * 1.4, 0.18], { clipR: Rr, alpha: a.a });
    drawOdometer(g, t, Rr.x + 40, Rr.y + 246, 168, a.a);
  }
  { // "Zaminsiz kredit" tile on 3.5–4.3 s — both lines finish before the reading hold at story 130
    const a = tileIn(t, 102), v = scrollV(t, 4), Rl = { ...T_LOCK, y: T_LOCK.y + a.dy + scrollY(t, 4) };
    tileBase(g, Rl, "#FFFFFF", 1, a.a);
    const id = idle(t, 1.7), ps = spring(t - 108, 0.3, 0.55);
    obj3D(g, O.shield, Rl.x + Rl.w - 145, Rl.y + 150 + id.bob, 300 * ps, [id.rx + v * 0.004, -0.35 + id.ry - (1 - ps) * 1.6, -0.12], { clipR: Rl, alpha: a.a });
    rise(g, COPY.lockup[0], Rl.x + 40, Rl.y + 122, 104, C.ink, smooth(prog(t, 106, 12)), { weight: 800, track: -0.03, alpha: a.a });
    rise(g, COPY.lockup[1], Rl.x + 40, Rl.y + 224, 104, C.ink, smooth(prog(t, 112, 12)), { weight: 800, track: -0.03, alpha: a.a });
  }
}
function drawOdometer(g, t, x, base, size, alpha) {
  g.save(); g.globalAlpha *= alpha; font(g, size, 800, 0); g.fillStyle = C.ink; g.textBaseline = "alphabetic";
  const band = [base - size * 0.82, base + size * 0.16], lh = size * 0.95, tr = -0.04 * size;
  let cx = x, col = 0;
  for (const ch of COPY.rate) {
    const aw = g.measureText(ch).width, start = 52 + col * 4;
    if (t >= start) {
      g.save(); g.beginPath(); g.rect(cx - 6, band[0], aw + 12, band[1] - band[0]); g.clip();
      if (/\d/.test(ch)) {
        const p = smooth(prog(t, start, 22)), v = p * (10 + +ch), i = Math.floor(v), f = v - i;
        g.fillText(String(i % 10), cx, base - f * lh); if (f > 0.001) g.fillText(String((i + 1) % 10), cx, base + (1 - f) * lh);
      } else g.fillText(ch, cx, base + (1 - smooth(prog(t, start, 10))) * size);
      g.restore();
    }
    col += /\d/.test(ch) ? 1 : 0.5; cx += aw + tr;
  }
  rise(g, COPY.rateSuffix, cx + 10, base, 64, C.ink, smooth(prog(t, 84, 12)), { weight: 700, track: -0.02 });
  g.restore();
}

/* ---------------- scene 3: the amount (big tile ↔ grid tile) ---------------- */
function drawAmount(g, t, Rbig, Rsmall, e) {
  // e: 0 = full amount view, 1 = grid tile
  const tile = lerpR(Rbig, Rsmall, e), k = lerp(1, Rsmall.w / GW, e);
  tileBase(g, tile, C.tAmount, k);
  g.save(); rr(g, tile.x, tile.y, tile.w, tile.h, 44 * k); g.clip();
  tileHeader(g, tile, k, COPY.amountTitle, prog(t, 150, 10), { glyph: "₼", icon: "#F2A93B" });
  const sk = Rsmall.w / GW;
  const D = lerpR({ x: Rbig.x, y: Rbig.y + 110, w: Rbig.w, h: 470 }, { x: Rsmall.x, y: Rsmall.y + Rsmall.h * 0.24, w: Rsmall.w, h: Rsmall.h * 0.5 }, e);
  const cap = lerp(230, 70 * sk, e);
  drawDigits(g, t, D, cap);
  // label: two centred lines (big) → one grey line (tile)
  if (e < 0.6) {
    g.save(); g.globalAlpha *= 1 - smooth(clamp(e / 0.45));
    const cy = D.y + D.h;
    rise(g, COPY.amountLabel[0], tile.x + tile.w / 2, cy + 100 * k, 92 * k, C.ink, smooth(prog(t, 166, 14)), { weight: 800, align: "center" });
    rise(g, COPY.amountLabel[1], tile.x + tile.w / 2, cy + 200 * k, 92 * k, C.ink, smooth(prog(t, 170, 14)), { weight: 800, align: "center" });
    g.restore();
  }
  if (e > 0.5) rise(g, COPY.amountLabel.join(" "), tile.x + 36 * k, tile.y + tile.h - 44 * k, 28 * k, C.inkSoft, smooth(prog(e, 0.5, 0.5)), { weight: 600, track: 0 });
  g.restore();
}
function drawDigits(g, t, D, cap) {
  if (t < 138) return;
  const img = SPR.amount, coin = SPR.coin; if (!img) return;
  const k = Math.min(D.w * 0.74 / img.width, D.h * 0.95 / img.height), w = img.width * k, h = img.height * k;
  const cx = D.x + D.w / 2 - w * 0.09, cy = D.y + D.h / 2;
  const tt = t - 140, sp = spring(tt, 0.3, 0.55);
  const land = Math.max(0, Math.sin(Math.min(1, Math.max(0, (tt - 6) / 10)) * Math.PI)) * 0.06;   // one soft squash on landing
  const id = idle(t, 0.8, 0.6);
  // contact shadow
  g.save(); g.globalAlpha = clamp(tt / 10); g.filter = `blur(${h * 0.08}px)`; g.fillStyle = "rgba(1,30,95,0.16)";
  g.beginPath(); g.ellipse(cx, cy + h * 0.46, w * 0.42, h * 0.06, 0, 0, 7); g.fill(); g.restore();
  g.save(); g.globalAlpha = clamp(tt / 4);
  g.translate(cx, cy + (1 - sp) * -D.h * 0.9 + id.bob * 0.6 * (h / 200)); g.rotate(id.ry * 0.04 - (1 - sp) * 0.12);
  g.scale(1 + land, 1 - land); g.drawImage(img, -w / 2, -h / 2, w, h); g.restore();
  if (t >= 156 && coin) {   // coin rolls in from the right, leans on the last zero
    const cs = h * 0.78, sc = spring(t - 156, 0.2, 0.82), xf = cx + w * 0.5 + cs * 0.22, x = lerp(xf + D.w * 0.7, xf, sc);
    const roll = (xf - x) / (cs / 2) + lerp(0, -0.22, smooth(prog(t, 164, 14)));
    g.save(); g.filter = `blur(${cs * 0.06}px)`; g.fillStyle = "rgba(1,30,95,0.16)"; g.beginPath(); g.ellipse(x, cy + cs * 0.48, cs * 0.34, cs * 0.05, 0, 0, 7); g.fill(); g.restore();
    g.save(); g.translate(x, cy + h * 0.04); g.rotate(roll); g.drawImage(coin, -cs / 2, -cs / 2, cs, cs * coin.height / coin.width); g.restore();
  }
}
/* ---------------- scene 4: grid (6.2–9.7 s, "VTB.az … onlayn … filialda … sürətli rəsmiləşdir") ---------------- */
const PULL = 186, EXP = 292;
function gridRects(t) {
  const c2 = { x: SLOT.amount.x + GW / 2, y: SLOT.amount.y + GH / 2 }, cb = { x: BIG.x + BIG.w / 2, y: BIG.y + BIG.h / 2 }, k0 = BIG.w / GW;
  const startOf = R => ({ x: cb.x + (R.x - c2.x) * k0, y: cb.y + (R.y - c2.y) * k0, w: R.w * k0, h: R.h * k0 });
  const lags = { amount: 0, rate: 3, portrait: 2, online: 4, branch: 5, fast: 7 }, r = {};
  for (const id in SLOT) { const s = spring(t - PULL - lags[id], 0.24, 0.8); r[id] = { R: lerpR(startOf(SLOT[id]), SLOT[id], s), s }; }
  return r;
}
const expandOf = t => spring(t - EXP, 0.22, 0.9);
function pushOut(R, t, center) {
  const p = accel(prog(t, EXP, 14)); if (p <= 0) return R;
  const dx = R.x + R.w / 2 - center.x, dy = R.y + R.h / 2 - center.y, d = Math.hypot(dx, dy) || 1;
  return { ...R, x: R.x + dx / d * 1700 * p, y: R.y + dy / d * 1700 * p };
}
const GRID_OBJ = {
  rate:   { o: () => O.pct,   size: 270, pos: [96, 92], rot: [0.25, -0.5, 0.18], color: () => C.tRate },
  online: { o: () => O.phone, size: 310, pos: [84, 110], rot: [0.2, -0.55, 0.22], color: () => C.tTerm },
  branch: { o: () => O.pin,   size: 250, pos: [94, 100], rot: [0.1, -0.4, 0],     color: () => C.tCom },
  fast:   { o: () => O.bolt,  size: 270, pos: [90, 104], rot: [0.15, -0.5, -0.2], color: () => "GRAD" },
};
function drawGridTile(g, t, id, R, ph) {
  const k = R.w / GW, idl = idle(t, ph, 0.8), dark = id === "fast";
  if (id === "portrait") {
    g.save(); softShadow(g, k); g.fillStyle = "#fff"; rr(g, R.x, R.y, R.w, R.h, 44 * k); g.fill(); g.restore();
    drawFootage(g, "portrait", R, 44 * k, 1.12, [0.6, 0.42]);
  } else {
    const spec = GRID_OBJ[id], L = COPY.grid[id];
    tileBase(g, R, spec.color(), k);
    g.save(); rr(g, R.x, R.y, R.w, R.h, 44 * k); g.clip();
    // object pops when its line is spoken (tick time), then floats
    const ps = id === "rate" ? 1 : lerp(0.55, 1, spring(t - TICKS[id] + 4, 0.3, 0.5));
    obj3D(g, spec.o(), R.x + R.w - spec.pos[0] * k, R.y + R.h - spec.pos[1] * k + idl.bob * k, spec.size * k * ps, [spec.rot[0] + idl.rx, spec.rot[1] + idl.ry - (1 - ps) * 2, spec.rot[2]], { clipR: R, radius: 44 * k });
    font(g, 34 * k, 800, -0.02); g.fillStyle = dark ? "#fff" : C.ink; g.textAlign = "left"; g.fillText(L[0], R.x + 36 * k, R.y + 76 * k);
    font(g, 28 * k, 600, 0); g.fillStyle = dark ? "rgba(255,255,255,0.75)" : C.inkSoft; g.fillText(L[1], R.x + 36 * k, R.y + 116 * k);
    g.restore();
  }
  checkbox(g, R.x + R.w - 64 * k, R.y + 24 * k, k, t, TICKS[id], dark ? "dark" : "light");
}
function drawScene4(g, t) {
  const G = gridRects(t), c5 = { x: SLOT.fast.x + GW / 2, y: SLOT.fast.y + GH / 2 };
  const ph = { portrait: 0, rate: 0.7, online: 1.9, branch: 3.3, fast: 4.4 };
  for (const id of ["portrait", "rate", "online", "branch"]) drawGridTile(g, t, id, pushOut(G[id].R, t, c5), ph[id]);
  { const Ra = pushOut(G.amount.R, t, c5); drawAmount(g, t, BIG, Ra, G.amount.s); }
  { // navy "Sürətli" tile expands into the end card
    const R0 = G.fast.R, ex = expandOf(t);
    if (ex <= 0) drawGridTile(g, t, "fast", R0, ph.fast);
    else {
      const R = lerpR(R0, { x: 0, y: 0, w: W, h: H }, ex);
      tileBase(g, R, "GRAD", 1);
      g.save(); g.globalAlpha = smooth(clamp(ex)); g.fillStyle = C.sting; rr(g, R.x, R.y, R.w, R.h, lerp(44, 0, clamp(ex))); g.fill(); g.restore();
      g.save(); g.globalAlpha = 1 - smooth(prog(t, EXP, 6)); drawGridTile(g, t, "fast", R0, ph.fast); g.restore();
    }
  }
  // headline: line 1 on "onlayn və ya … filialda" (7.4 s), line 2 on "sürətli rəsmiləşdir" (9.1 s)
  const hp = accel(prog(t, EXP, 12)) * 800;
  let hs = 86; font(g, hs, 800, -0.03); while (Math.max(...COPY.headline.map(l => g.measureText(l).width)) > BOX.w) { hs -= 2; font(g, hs, 800, -0.03); }
  rise(g, COPY.headline[0], BOX.x, HEAD_Y[0] - hp, hs, "#fff", smooth(prog(t, 220, 14)), { weight: 800, track: -0.03 });
  rise(g, COPY.headline[1], BOX.x, HEAD_Y[1] - hp, hs, "#fff", smooth(prog(t, 272, 14)), { weight: 800, track: -0.03 });
}

/* ---------------- one instant ---------------- */
function drawAt(g, tReal) {
  RT = tReal; const t = toStory(tReal);
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.filter = "none";
  g.fillStyle = bgGradient(g); g.fillRect(0, 0, W, H);
  if (t < 162) drawScene12(g, t);
  if (t >= SCROLL && t < PULL) { const R = { ...BIG, y: BIG.y + scrollY(t, 3) + H }; drawAmount(g, t, R, R, 0); }
  if (t >= PULL && t < EXP + 20) drawScene4(g, t);
  if (t >= EXP + 20) { g.fillStyle = C.sting; g.fillRect(0, 0, W, H); }   // hand-off frame = first frame of the sting
}

/* ---------------- frame (sub-frame accumulation = real motion blur) ---------------- */
let showSafe = false;
function renderFrame(f, sub = 1) {
  f = Math.max(0, Math.min(FRAMES - 1, f));
  out.setTransform(1, 0, 0, 1, 0, 0); out.globalAlpha = 1;
  if (sub <= 1) { drawAt(ctx, f); out.drawImage(buf, 0, 0); }
  else {
    // more samples on the fast moves (shrink, scroll, pull-back, end-card expand) so the blur is smooth, not strobed
    const st = toStory(f);
    const fast = (st >= 18 && st <= 40) || (st > 130 && st <= 162) || (st > 184 && st <= 208) || (st > 288 && st <= 312);
    const n = fast ? Math.max(sub, 12) : sub, shutter = 0.4;
    for (let i = 0; i < n; i++) {
      drawAt(ctx, Math.max(0, f + (i / (n - 1) - 0.5) * shutter));
      actx.globalAlpha = 1 / (i + 1); actx.drawImage(buf, 0, 0);
    }
    actx.globalAlpha = 1; out.drawImage(acc, 0, 0);
  }
  if (showSafe) { out.save(); out.strokeStyle = "rgba(255,0,80,0.8)"; out.lineWidth = 3; out.setLineDash([16, 10]); out.strokeRect(BOX.x, BOX.y, BOX.w, BOX.h); out.restore(); }
}

/* ---------------- boot ---------------- */
window.FILM = { W, H, FPS, FRAMES, renderFrame };
window.filmReady = (async () => {
  await Promise.all([
    document.fonts.load('800 100px "VTB Group"', "ZAMİNSİZ əİığşçöü 0123456789% ₼"),
    document.fonts.load('700 100px "VTB Group"', "Onlayn əİığşçöü"),
    document.fonts.load('600 100px "VTB Group"', "Neft və mədənçıxarma işçilərinə"),
    document.fonts.load('400 100px "VTB Group"', "Kredit illik"),
  ]);
  for (const n of ["pct", "shield", "coin", "amount", "phone", "pin", "bolt"]) { SPR[n] = await loadImg(`assets/objects/${n}.png`); if (!SPR[n]) throw new Error("missing assets/objects/" + n + ".png"); }
  const imgs = await Promise.all(Array.from({ length: FOOTAGE_FRAMES }, (_, i) => loadImg(`footage/frames/${String(i + 1).padStart(4, "0")}.jpg`)));
  FOOT.push(...imgs.filter(Boolean));
  if (!FOOT.length) throw new Error("footage frames missing — run render.mjs (it extracts footage/frames/ from footage/worker.mp4)");
  return true;
})();

const qs = new URLSearchParams(location.search);
if (qs.has("render")) document.body.classList.add("render");
else window.filmReady.then(() => {
  const scrub = document.getElementById("scrub"), tc = document.getElementById("tc"), btn = document.getElementById("play");
  let f = +(qs.get("f") || 0), playing = !qs.has("f"), last = 0;
  const show = () => { renderFrame(f, 1); scrub.value = f; tc.textContent = `f${String(f).padStart(3, "0")} · ${(f / FPS).toFixed(2)}s`; };
  scrub.oninput = () => { f = +scrub.value; playing = false; btn.textContent = "Play"; show(); };
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? "Pause" : "Play"; };
  document.getElementById("safe").onchange = e => { showSafe = e.target.checked; show(); };
  btn.textContent = playing ? "Pause" : "Play";
  const tick = ts => { if (playing && ts - last >= 1000 / FPS) { last = ts; f = (f + 1) % FRAMES; show(); } requestAnimationFrame(tick); };
  show(); requestAnimationFrame(tick);
});
</script>
</body>
