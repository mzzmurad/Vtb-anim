<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VTB Cake Logo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #111; }
  html, body { margin: 0; background: var(--bg); height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  #c { height: 100vh; width: auto; max-width: 100vw; aspect-ratio: 9 / 16; display: block; }
  #gl { display: none; }
  body.render #c { height: 1920px; width: 1080px; }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three/build/three.module.min.js", "three/addons/": "../vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// One whole cake → a knife makes four cuts → the two cut strips slide out → the three VTB bars remain.

// ---------------------------------------------------------------- setup
const W = 1080, H = 1920, FPS = 30, DUR = 9.0, FRAMES = Math.round(DUR * FPS);
// Stepped, stop-motion timing like the reference: poses update STEP times a second and are held
// (2–3 output frames each at 30 fps), with no motion blur. Set STEP = 0 for smooth motion.
const STEP = +(params0().get("step") ?? 12);
function params0() { return new URLSearchParams(location.search); }
const params = new URLSearchParams(location.search);
const RENDER = params.has("render");
if (RENDER) document.body.classList.add("render");

const C = {
  bgTop: "#0755C2", bgBottom: "#67C6FF",   // the supplied background gradient
  shadow: "#00225e",
  icing: "#FFFFFF",
  navy: "#04378F",
  blue: "#00AEEF",
  sponge: "#F2C744",
  rosette: "#FFFFFF",
  cut: "#8aa3c2",
};

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.domElement.id = "gl";
document.body.appendChild(renderer.domElement);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
{
  const cv = document.createElement("canvas"); cv.width = 4; cv.height = 512;
  const g = cv.getContext("2d"), gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, C.bgTop); gr.addColorStop(1, C.bgBottom);
  g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;

const camera = new THREE.PerspectiveCamera(30, W / H, 0.05, 200);

scene.add(new THREE.HemisphereLight("#ffffff", "#7fb4e6", 1.2));
const sun = new THREE.DirectionalLight("#fffaf0", 2.2);
sun.position.set(-8, 8, -7);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: 1, far: 40 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
sun.shadow.radius = 3;
scene.add(sun, sun.target);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ color: C.shadow, opacity: 0.38 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------------------------------------------------------------- logo geometry
// The supplied logo, in its own pixels (820 × 505). The three bars are exactly one
// slanted slab with two horizontal strips removed — so the cake is that slab, cut twice per strip.
const SL = 183 / 504;                         // ends slant: x shrinks by SL per px down
const XL = y => 183 - y * SL, XR = y => 820 - y * SL;
const quad = (y0, y1) => [[XL(y0), y0], [XR(y0), y0], [XR(y1), y1], [XL(y1), y1]];
const BAND = {            // final pieces, top to bottom
  bar1: [0, 126], stripA: [126, 190], bar2: [190, 316], stripB: [316, 378], bar3: [378, 504],
};
const ORDER = ["bar1", "stripA", "bar2", "stripB", "bar3"];
const S = 1 / 100, CX = 410, CY = 252;
const toW = ([x, y]) => [(x - CX) * S, (y - CY) * S];          // → world x, z

const LAYERS = [ // bottom → top
  [C.navy, 0.15, "cream"],
  [C.sponge, 0.2, "sponge"],
  [C.blue, 0.12, "cream"],
  [C.sponge, 0.2, "sponge"],
];
const ICING_H = 0.17;
const CAKE_H = LAYERS.reduce((s, l) => s + l[1], 0);
const TOP_Y = CAKE_H + ICING_H;

function roundedShape(pts, radii) {
  const s = new THREE.Shape(), n = pts.length;
  const P = pts.map(p => { const [x, z] = toW(p); return new THREE.Vector2(x, -z); });
  for (let i = 0; i < n; i++) {
    const p = P[i], prev = P[(i + n - 1) % n], next = P[(i + 1) % n], r = radii[i];
    const a = p.clone().add(prev.clone().sub(p).setLength(r));
    const b = p.clone().add(next.clone().sub(p).setLength(r));
    if (i === 0) s.moveTo(a.x, a.y); else s.lineTo(a.x, a.y);
    if (r > 0) s.quadraticCurveTo(p.x, p.y, b.x, b.y);
  }
  s.closePath();
  return s;
}

function spongeTexture() {
  const cv = document.createElement("canvas"); cv.width = cv.height = 512;
  const g = cv.getContext("2d");
  g.fillStyle = C.sponge; g.fillRect(0, 0, 512, 512);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 9000; i++) {
    const r = 0.6 + rnd() * 2.2, l = rnd();
    g.fillStyle = l < 0.5 ? `rgba(196,140,20,${0.25 + rnd() * 0.35})` : `rgba(255,236,150,${0.3 + rnd() * 0.4})`;
    g.beginPath(); g.arc(rnd() * 512, rnd() * 512, r, 0, Math.PI * 2); g.fill();
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1.6, 1.6); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const SPONGE_TEX = spongeTexture();
const mats = {
  icing: new THREE.MeshStandardMaterial({ color: C.icing, roughness: 0.5 }),
  sponge: new THREE.MeshStandardMaterial({ color: "#ffffff", map: SPONGE_TEX, roughness: 0.95, bumpMap: SPONGE_TEX, bumpScale: 1.5 }),
  rosette: new THREE.MeshStandardMaterial({ color: C.rosette, roughness: 0.42 }),
  navy: new THREE.MeshStandardMaterial({ color: C.navy, roughness: 0.5 }),
  blue: new THREE.MeshStandardMaterial({ color: C.blue, roughness: 0.45 }),
};
const layerMat = (col, kind) => kind === "sponge" ? mats.sponge : col === C.navy ? mats.navy : mats.blue;

// a cake body over logo rows y0..y1; outer corners of the whole slab are rounded
const R = 0.14;
function makeBody(y0, y1) {
  const g = new THREE.Group();
  const radii = [y0 === 0 ? R : 0, y0 === 0 ? R : 0, y1 === 504 ? R : 0, y1 === 504 ? R : 0];
  const shape = roundedShape(quad(y0, y1), radii);
  let y = 0;
  for (const [col, h, kind] of [...LAYERS, [C.icing, ICING_H, "icing"]]) {
    const geo = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false, curveSegments: 8 });
    geo.rotateX(-Math.PI / 2); geo.translate(0, y, 0);
    const m = new THREE.Mesh(geo, kind === "icing" ? mats.icing : layerMat(col, kind));
    m.castShadow = m.receiveShadow = true; g.add(m); y += h;
  }
  return g;
}

function rosetteGeometry() {
  const prof = [[0, 0], [0.125, 0], [0.13, 0.03], [0.115, 0.07], [0.085, 0.12], [0.05, 0.17], [0.018, 0.215], [0, 0.23]]
    .map(([r, y]) => new THREE.Vector2(r, y));
  const geo = new THREE.LatheGeometry(prof, 64);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const th = Math.atan2(z, x), r = Math.hypot(x, z);
    const k = 1 + 0.26 * Math.pow(Math.max(0, Math.cos(8 * th + y * 9)), 0.7) - 0.08;
    p.setXYZ(i, Math.cos(th) * r * k, y, Math.sin(th) * r * k);
  }
  geo.computeVertexNormals();
  return geo;
}
const ROSETTE = rosetteGeometry();
const SPRINKLE = new THREE.CapsuleGeometry(0.018, 0.05, 3, 8);
const SPRINKLE_COLS = ["#ff4d6d", "#00AEEF", "#04378F", "#2ec27e", "#ffb000", "#a06cff", "#ff8a3d"].map(c => new THREE.Color(c));

// ---------------------------------------------------------------- build
const CAKE_YAW = 0.42;
const cake = new THREE.Group();
cake.rotation.y = CAKE_YAW;
scene.add(cake);

const rnd = (() => { let s = 12345; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

// final pieces: each has a group (moves) with rosettes + sprinkles + its own body (shown once cut)
const P = {};
for (const k of ORDER) {
  const grp = new THREE.Group(); cake.add(grp);
  const body = makeBody(...BAND[k]); grp.add(body);
  P[k] = { grp, body };
}
// bodies used before the cuts: the whole slab, then everything below strip A
const WHOLE = makeBody(0, 504); cake.add(WHOLE);
const LOWER = makeBody(190, 504); cake.add(LOWER);

const bandOf = y => ORDER.find(k => y >= BAND[k][0] - 1e-6 && y < BAND[k][1]) || "bar3";

// rosettes along the slab's outline, each owned by the piece its row belongs to
{
  const outline = roundedShape(quad(0, 504), [R, R, R, R]);
  const n = Math.round(outline.getLength() / 0.19);
  const pts = outline.getSpacedPoints(n);
  const by = {};
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n];
    const wx = a.x, wz = -a.y, tx = b.x - a.x, tz = -(b.y - a.y);
    let ox = tz, oz = -tx; const L = Math.hypot(ox, oz) || 1; ox /= L; oz /= L;
    if (wx * ox + wz * oz < 0) { ox = -ox; oz = -oz; }
    const k = bandOf(wz / S + CY);
    (by[k] ||= []).push([wx + ox * 0.07, wz + oz * 0.07, rnd()]);
  }
  for (const [k, list] of Object.entries(by)) {
    const inst = new THREE.InstancedMesh(ROSETTE, mats.rosette, list.length);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion();
    list.forEach(([x, z, r], i) => {
      q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), r * 6.28);
      const sc = 0.95 + r * 0.12;
      m.compose(new THREE.Vector3(x, 0, z), q, new THREE.Vector3(sc, sc * (0.95 + r * 0.15), sc));
      inst.setMatrixAt(i, m);
    });
    inst.castShadow = inst.receiveShadow = true;
    P[k].grp.add(inst);
  }
}

// sprinkles, kept clear of the cut lines
for (const k of ORDER) {
  const [y0, y1] = BAND[k];
  const count = Math.round((y1 - y0) / 126 * 55);
  const list = [];
  for (let i = 0; i < count; i++) {
    const py = y0 + 14 + rnd() * (y1 - y0 - 28);
    const px = XL(py) + 25 + rnd() * (XR(py) - XL(py) - 50);
    list.push([...toW([px, py]), rnd(), Math.floor(rnd() * SPRINKLE_COLS.length)]);
  }
  const inst = new THREE.InstancedMesh(SPRINKLE, new THREE.MeshStandardMaterial({ roughness: 0.35 }), list.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  list.forEach(([x, z, r1, ci], i) => {
    e.set(Math.PI / 2, 0, r1 * 6.28); q.setFromEuler(e);
    m.compose(new THREE.Vector3(x, TOP_Y + 0.012, z), q, new THREE.Vector3(1, 1, 1));
    inst.setMatrixAt(i, m); inst.setColorAt(i, SPRINKLE_COLS[ci]);
  });
  inst.castShadow = true;
  P[k].grp.add(inst);
}

// candles: spiral-striped, on the three bars (clear of the cut lines)
const flames = [];
function stripeTexture(col) {
  const cv = document.createElement("canvas"); cv.width = 256; cv.height = 512;
  const g = cv.getContext("2d");
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, 256, 512);
  g.fillStyle = col;
  for (let k = -4; k < 8; k++) {
    g.beginPath();
    g.moveTo(0, k * 96); g.lineTo(256, k * 96 - 160); g.lineTo(256, k * 96 - 110); g.lineTo(0, k * 96 + 50); g.fill();
  }
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const wickMat = new THREE.MeshStandardMaterial({ color: "#3a2a1a" });
const flameMat = new THREE.MeshBasicMaterial({ color: "#ffb21f" }), coreMat = new THREE.MeshBasicMaterial({ color: "#fff6c8" });
function addCandle(piece, px, py, col, CH, phase) {
  const CR = 0.062;
  const candle = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(CR, CR, CH, 40), new THREE.MeshStandardMaterial({ map: stripeTexture(col), roughness: 0.38 }));
  body.position.y = CH / 2; body.rotation.y = phase * 6.28; body.castShadow = true; candle.add(body);
  const wick = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.07, 8), wickMat);
  wick.position.y = CH + 0.035; candle.add(wick);
  const fg = new THREE.SphereGeometry(0.045, 24, 16); fg.scale(1, 2.1, 1);
  const flame = new THREE.Mesh(fg, flameMat);
  flame.position.y = CH + 0.12; candle.add(flame);
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.022, 16, 12).scale(1, 2, 1), coreMat);
  core.position.y = -0.02; flame.add(core);
  const [x, z] = toW([px, py]);
  candle.position.set(x, TOP_Y - 0.01, z);
  P[piece].grp.add(candle);
  flames.push({ flame, phase: phase * 10 });
}
// [piece, logo x, logo y, stripe colour, height]
for (const [k, px, py, col, h] of [
  ["bar1", 330, 63, "#1f7fe0", 0.6], ["bar1", 520, 60, "#04378F", 0.68], ["bar1", 700, 66, "#00AEEF", 0.56],
  ["bar2", 200, 253, "#00AEEF", 0.64], ["bar2", 420, 250, "#1f7fe0", 0.58], ["bar2", 630, 256, "#04378F", 0.66],
  ["bar3", 128, 441, "#1f7fe0", 0.62], ["bar3", 330, 444, "#04378F", 0.57], ["bar3", 540, 438, "#00AEEF", 0.65],
]) addCandle(k, px, py, col, h, rnd());

// knife: steel blade (origin at the tip, on the cutting edge), handle at +x
const BLADE_L = 3.0, BLADE_H = 0.72, KS = 1.2;   // KS: knife scale
const knife = new THREE.Group();
{
  const s = new THREE.Shape();
  s.moveTo(0, BLADE_H * 0.62);                              // tip, near the spine
  s.quadraticCurveTo(0.45, 0.02, 1.3, 0);                  // curved belly
  s.lineTo(BLADE_L, 0);
  s.lineTo(BLADE_L, BLADE_H);
  s.quadraticCurveTo(1.2, BLADE_H * 0.98, 0, BLADE_H * 0.62);
  const geo = new THREE.ExtrudeGeometry(s, { depth: 0.022, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.006, bevelSegments: 2, curveSegments: 16 });
  geo.translate(0, 0, -0.011);
  const blade = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: "#ffffff", metalness: 0.35, roughness: 0.22 }));
  blade.castShadow = true; knife.add(blade);
  const steel = new THREE.MeshStandardMaterial({ color: "#c9d2dc", metalness: 1, roughness: 0.25 });
  const bolster = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.34, 0.09), steel);
  bolster.position.set(BLADE_L + 0.06, BLADE_H - 0.17, 0); bolster.castShadow = true; knife.add(bolster);
  const hg = new THREE.CapsuleGeometry(0.13, 1.15, 6, 24); hg.rotateZ(Math.PI / 2); hg.scale(1, 1.15, 0.8);
  const handle = new THREE.Mesh(hg, new THREE.MeshStandardMaterial({ color: "#14223a", roughness: 0.35 }));
  handle.position.set(BLADE_L + 0.12 + 0.71, BLADE_H - 0.2, 0); handle.castShadow = true; knife.add(handle);
  for (const dx of [0.35, 0.75, 1.1]) {
    const rv = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.24, 16), steel);
    rv.rotation.x = Math.PI / 2; rv.position.set(BLADE_L + 0.12 + dx, BLADE_H - 0.2, 0); knife.add(rv);
  }
}
knife.scale.setScalar(KS);
cake.add(knife);

// cut lines drawn on the icing behind the knife
const cutMat = new THREE.MeshBasicMaterial({ color: C.cut });
const CUTS = [126, 190, 316, 378].map(y => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(1, 0.004, 0.016), cutMat);
  m.position.set(0, TOP_Y + 0.002, toW([0, y])[1]);
  m.visible = false; cake.add(m);
  return { y, m };
});

// ---------------------------------------------------------------- timeline
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp01 = x => Math.min(1, Math.max(0, x));
const ease = {
  inOut: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  sine: t => 0.5 - Math.cos(Math.PI * t) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
};
const seg = (t, a, b, e = ease.inOut) => e(clamp01((t - a) / (b - a)));
const lerp = (a, b, k) => a + (b - a) * k;

// world x of the line ends, in cake space (cut lines run straight along x)
const lineX = y => [toW([XL(y), y])[0], toW([XR(y), y])[0]];
const lineZ = y => toW([0, y])[1];
const UP = TOP_Y + 1.5, DOWN = 0.3, OVER = 0.25;   // knife edge heights; overshoot past the ends

// knife keyframes: [time, tip x, edge y, z]. Cuts 1 and 3 push right→left; 2 and 4 pull left→right.
const KF = [], T_CUT = [];
const LOWER_T = 0.15, CUT_T = 0.8, LIFT_T = 0.12, HOP_T = 0.18;
let T_SPLIT_A, T_SPLIT_B, T_KNIFE_OUT;
{
  const L = BLADE_L * KS;
  let t = 0;
  const [, r1] = lineX(126);
  KF.push([0, r1 + 3.5, UP + 2.5, lineZ(126) - 1.5]);   // off frame, up right
  t = 0.7;
  const cut = (y, dir) => {   // knife arrives UP above the start of this line, then cuts it
    const [l, r] = lineX(y), z = lineZ(y);
    const x0 = dir < 0 ? r - 0.2 : l - L + 0.2, x1 = dir < 0 ? l - L - OVER : r + OVER;
    KF.push([t, x0, UP, z]); t += LOWER_T;
    KF.push([t, x0, DOWN, z]); T_CUT.push([t, t + CUT_T, dir]); t += CUT_T;
    KF.push([t, x1, DOWN, z]); t += LIFT_T;
    KF.push([t, x1, UP, z]);
  };
  cut(126, -1); t += HOP_T;
  cut(190, +1); T_SPLIT_A = t;
  t += 0.75;                    // the strip slides out while the knife crosses over
  cut(316, -1); t += HOP_T;
  cut(378, +1); T_SPLIT_B = t;
  T_KNIFE_OUT = t + 0.7;
  const last = KF[KF.length - 1];
  KF.push([T_KNIFE_OUT, last[1] + 4.0, UP + 3.0, last[3] + 0.5]);   // away
}

function knifeAt(t) {
  let i = 0; while (i < KF.length - 2 && t > KF[i + 1][0]) i++;
  const [ta, xa, ya, za] = KF[i], [tb, xb, yb, zb] = KF[i + 1];
  const cutting = ya === DOWN && yb === DOWN;
  const k = (cutting ? ease.sine : ease.inOut)(clamp01((t - ta) / (tb - ta)));
  return { x: lerp(xa, xb, k), y: lerp(ya, yb, k), z: lerp(za, zb, k), cutting };
}

// how far each cut has run, as [x0, x1] in cake space
function cutExtent(i, t) {
  const [a, b, dir] = T_CUT[i];
  if (t < a) return null;
  const [l, r] = lineX(CUTS[i].y);
  const kx = knifeAt(Math.min(t, b)).x;
  if (dir < 0) return [Math.max(l, kx), r];                         // tip has reached kx
  return [l, Math.min(r, kx + BLADE_L * KS)];                           // heel has reached kx + L
}

// camera: close on the knife while it cuts (following a smoothed point on the blade), then out to the whole logo
// end shot, in CAKE space: almost straight down, square to the cake, so the logo sits level like the flat mark
const WIDE = { pos: V(0, 31, 5.5), tgt: V(0, 0.4, 0), fov: 30 };
const CLOSE_OFF = V(1.0, 2.6, 4.0), CLOSE_FOV = 34;
const ROT = new THREE.Matrix4().makeRotationY(CAKE_YAW);
function focusAt(t) {             // blade centre, averaged over ~1.2 s around t and damped toward the cake centre,
  let x = 0, z = 0, w = 0;        // so the camera drifts with the knife instead of whipping after it
  for (let k = -12; k <= 12; k++) {
    const tt = Math.max(0, t + k * 0.03), wk = Math.cos(k / 13 * Math.PI / 2) ** 2;
    const kn = knifeAt(tt);
    x += (kn.x + BLADE_L * KS * 0.45) * wk; z += kn.z * wk; w += wk;
  }
  return V(Math.min(3.0, Math.max(-2.3, 0.85 * x / w)), TOP_Y * 0.75, z / w);
}
const T_OUT0 = () => T_SPLIT_B + 0.2, T_OUT1 = () => T_SPLIT_B + 2.0;
// spherical helpers (cake space): radius, elevation, azimuth around a target
const toSph = v => ({ r: v.length(), el: Math.asin(v.y / v.length()), az: Math.atan2(v.x, v.z) });
const fromSph = ({ r, el, az }) => V(r * Math.cos(el) * Math.sin(az), r * Math.sin(el), r * Math.cos(el) * Math.cos(az));
const easeOutBack = t => { const c = 1.4; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

function shotAt(t) {
  const f = focusAt(Math.min(t, T_OUT0()));          // cake space
  const k = seg(t, T_OUT0(), T_OUT1(), ease.inOut);
  if (k <= 0) return { pos: f.clone().add(CLOSE_OFF).applyMatrix4(ROT), tgt: f.clone().applyMatrix4(ROT), fov: CLOSE_FOV };
  // pull out: the camera orbits round to face the cake square-on and rises to straight down,
  // so the logo turns into alignment and settles level (a small overshoot, then lands)
  const a = toSph(CLOSE_OFF), b = toSph(WIDE.pos.clone().sub(WIDE.tgt));
  const kr = clamp01((t - T_OUT0()) / (T_OUT1() - T_OUT0()));
  const az = lerp(a.az + 0.9, b.az, easeOutBack(kr));   // swing round from 0.9 rad further out
  const sph = { r: lerp(a.r, b.r, k), el: lerp(a.el, b.el, ease.out(kr)), az };
  const tgtL = f.clone().lerp(WIDE.tgt, ease.out(kr));
  const posL = tgtL.clone().add(fromSph(sph));
  // after landing, a slow push-in that keeps the logo level
  const hold = Math.max(0, t - T_OUT1());
  return { pos: posL.applyMatrix4(ROT), tgt: tgtL.applyMatrix4(ROT), fov: lerp(CLOSE_FOV, WIDE.fov, k) - hold * 0.6 };
}

// a cut strip lifts, then slides out along its length
function stripAt(t, t0, dir) {
  const up = seg(t, t0 + 0.04, t0 + 0.26, ease.out);
  const slide = seg(t, t0 + 0.2, t0 + 0.95, ease.in);
  return V(dir * 14 * slide, 0.32 * up, 0);
}

function setScene(t) {
  // which bodies exist
  const afterA = t >= T_SPLIT_A, afterB = t >= T_SPLIT_B;
  WHOLE.visible = !afterA;
  P.bar1.body.visible = P.stripA.body.visible = afterA;
  LOWER.visible = afterA && !afterB;
  P.bar2.body.visible = P.stripB.body.visible = P.bar3.body.visible = afterB;

  // knife + cut lines
  const kn = knifeAt(t);
  knife.position.set(kn.x, kn.y, kn.z);
  knife.rotation.z = kn.cutting ? 0 : 0.04 * Math.sin(t * 3);
  CUTS.forEach((c, i) => {
    const e = cutExtent(i, t);
    const gone = i < 2 ? t > T_SPLIT_A + 0.06 : t > T_SPLIT_B + 0.06;
    c.m.visible = !!e && e[1] - e[0] > 0.01 && !gone;
    if (c.m.visible) { c.m.scale.x = e[1] - e[0]; c.m.position.x = (e[0] + e[1]) / 2; }
  });

  // strips slide out: A to the right (the way the knife left), B to the left
  P.stripA.grp.position.copy(stripAt(t, T_SPLIT_A, +1));
  P.stripB.grp.position.copy(stripAt(t, T_SPLIT_B, -1));
  P.stripA.grp.visible = t < T_SPLIT_A + 1.2;
  P.stripB.grp.visible = t < T_SPLIT_B + 1.2;

  for (const { flame, phase } of flames) {
    flame.scale.set(1 + Math.sin(t * 31 + phase) * 0.06, 1 + Math.sin(t * 23 + 1 + phase) * 0.1, 1);
    flame.rotation.z = Math.sin(t * 17 + phase) * 0.08;
  }

  const s = shotAt(t);
  camera.position.copy(s.pos); camera.fov = s.fov; camera.updateProjectionMatrix();
  camera.lookAt(s.tgt);
}

// ---------------------------------------------------------------- frame
const out = document.getElementById("c");
const ctx = out.getContext("2d");
function renderFrame(f, sub = 1) {
  const shutter = 0.5; // 180°
  if (STEP > 0) { f = Math.floor(f / FPS * STEP + 1e-6) / STEP * FPS; sub = 1; }
  for (let s = 0; s < sub; s++) {
    const tf = sub === 1 ? f : f + ((s + 0.5) / sub - 0.5) * shutter;
    setScene(Math.max(0, tf) / FPS);
    renderer.render(scene, camera);
    ctx.globalAlpha = 1 / (s + 1);
    ctx.drawImage(renderer.domElement, 0, 0);
  }
  ctx.globalAlpha = 1;
}

window.FILM = { FRAMES, FPS, renderFrame };
window.filmReady = true;

if (!RENDER) {
  const f0 = params.has("f") ? +params.get("f") : null;
  if (f0 != null) renderFrame(f0, 1);
  else {
    const t0 = performance.now();
    const loop = () => { renderFrame(((performance.now() - t0) / 1000 * FPS) % FRAMES, 1); requestAnimationFrame(loop); };
    loop();
  }
}
</script>
